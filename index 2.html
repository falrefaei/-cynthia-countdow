<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>وصول سنتيا إلى الكويت</title>
<meta name="theme-color" content="#f5efe7">
<style>
:root{--bg:#f5efe7;--card:#fffaf4;--text:#2f2924;--muted:#786d63;--accent:#988065;--line:#ddd0c0}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:flex;justify-content:center;align-items:center;background:linear-gradient(145deg,#faf7f2,#eee5da);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Tahoma,Arial,sans-serif;color:var(--text);padding:18px}
.card{width:min(920px,100%);background:rgba(255,250,244,.94);border:1px solid rgba(152,128,101,.16);border-radius:30px;padding:30px;box-shadow:0 18px 50px rgba(74,57,40,.12)}
.tag{color:var(--accent);font-weight:800;font-size:14px;margin-bottom:10px}
h1{margin:0;font-size:clamp(34px,7vw,64px);line-height:1.05}
.sub{color:var(--muted);margin-top:12px;font-size:16px}
.countdown{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:30px}
.box{background:white;border:1px solid rgba(152,128,101,.14);border-radius:22px;padding:22px 8px;text-align:center}
.num{display:block;color:var(--accent);font-weight:900;font-size:clamp(34px,9vw,62px);line-height:1;font-variant-numeric:tabular-nums}
.label{display:block;margin-top:9px;color:var(--muted);font-size:13px}
.flight{margin-top:22px;display:flex;justify-content:space-between;gap:14px;flex-wrap:wrap;border-top:1px solid var(--line);padding-top:20px}
.item{flex:1 1 150px}.k{color:var(--muted);font-size:12px;margin-bottom:4px}.v{font-size:18px;font-weight:800}
.note{margin-top:18px;color:var(--muted);font-size:12px;line-height:1.7}
.arrived{display:none;margin-top:28px;background:rgba(152,128,101,.10);color:var(--accent);padding:24px;border-radius:22px;font-size:30px;font-weight:900;text-align:center}
@media(max-width:600px){.card{padding:22px 16px}.countdown{gap:7px}.box{padding:18px 4px;border-radius:17px}.label{font-size:11px}}
</style>
</head>
<body>
<div class="card">
<div class="tag">✈️ KU418</div>
<h1>سنتيا إلى الكويت</h1>
<div class="sub">العد التنازلي حتى الوصول إلى مطار الكويت الدولي</div>

<div class="countdown" id="countdown">
<div class="box"><span class="num" id="d">--</span><span class="label">يوم</span></div>
<div class="box"><span class="num" id="h">--</span><span class="label">ساعة</span></div>
<div class="box"><span class="num" id="m">--</span><span class="label">دقيقة</span></div>
<div class="box"><span class="num" id="s">--</span><span class="label">ثانية</span></div>
</div>

<div class="arrived" id="arrived">وصلت سنتيا إلى الكويت 🤍</div>

<div class="flight">
<div class="item"><div class="k">من</div><div class="v">مانيلا MNL</div></div>
<div class="item"><div class="k">إلى</div><div class="v">الكويت KWI</div></div>
<div class="item"><div class="k">موعد الوصول</div><div class="v">09 سبتمبر 2026 • 02:50 ص</div></div>
<div class="item"><div class="k">المبنى</div><div class="v">Terminal 4</div></div>
</div>

<div class="note">التوقيت محسوب حسب توقيت الكويت UTC+3</div>
</div>

<script>
(function(){
var target=Date.UTC(2026,8,8,23,50,0);
function pad(n){return n<10?"0"+n:String(n)}
function tick(){
var diff=target-Date.now();
if(diff<=0){
document.getElementById("countdown").style.display="none";
document.getElementById("arrived").style.display="block";
return;
}
var sec=Math.floor(diff/1000);
var days=Math.floor(sec/86400); sec%=86400;
var hours=Math.floor(sec/3600); sec%=3600;
var mins=Math.floor(sec/60);
var secs=sec%60;
document.getElementById("d").textContent=pad(days);
document.getElementById("h").textContent=pad(hours);
document.getElementById("m").textContent=pad(mins);
document.getElementById("s").textContent=pad(secs);
}
tick();
setInterval(tick,1000);
})();
</script>
</body>
</html>
